version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5299:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbSettings__ConnectionString=mongodb+srv://smartsolar_project:OFqdiUao8e5gzFEU@smartsolarcluster.uetqtpg.mongodb.net/
      - MongoDbSettings__DatabaseName=SmartSolarMicrogridDB
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
